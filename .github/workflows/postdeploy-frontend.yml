name: PixBen Netlify post-deployment validation

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/postdeploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify published frontend scripts and API integration
        run: |
          python3 - <<'PY'
          import time,urllib.request
          BASE = "https://pixben.netlify.app/"
          expected = {
              "htmls/productos.html": "productos.js?v=11",
              "js/productos.js?v=11": "/productos/pagina",
              "js/paginas/index-destacados.js?v=2": "/productos/destacados",
              "js/paginas/carrito.js?v=10": "/productos/por-ids",
              "js/admin.js?v=20": "/pedidos/admin/pagina",
          }
          for attempt in range(36):
              try:
                  for path, substring in expected.items():
                      request=urllib.request.Request(BASE+path,headers={"User-Agent":"PixBenNetlifyPostDeployCheck/1.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          body=response.read().decode("utf-8",errors="replace")
                          if response.status != 200 or substring not in body:
                              raise RuntimeError(f"Unexpected deployed content in {path}")
                          print(f"PASS {path} HTTP {response.status}",flush=True)
                  print("NETLIFY_DEPLOY_VERIFIED",flush=True)
                  break
              except Exception as exc:
                  print(f"Waiting for Netlify deployment {attempt+1}/36: {str(exc)[:180]}",flush=True)
                  time.sleep(10)
          else:
              raise SystemExit("Netlify did not publish expected PixBen assets")
          PY
