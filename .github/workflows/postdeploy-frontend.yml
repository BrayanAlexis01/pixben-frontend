name: PixBen Netlify post-deployment validation

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/postdeploy-frontend.yml"
      - "public_html/js/paginas/mis-pedidos.js"
      - "public_html/js/paginas/carrito.js"
      - "public_html/js/productos.js"
      - "public_html/css/css carrito de compras.css"
      - "public_html/htmls/personaliza.html"
      - "public_html/css/css personaliza.css"
      - "public_html/css/accessibility.css"
      - "public_html/index.html"
      - "public_html/htmls/carrito de compras.html"
      - "public_html/htmls/politica de privacidad.html"
      - "public_html/htmls/politica de cookies.html"
      - "public_html/htmls/preguntas frecuentes.html"
      - "public_html/css/cuenta-listados.css"
      - "public_html/htmls/contacto.html"
      - "public_html/htmls/favoritos.html"
      - "public_html/js/paginas/favoritos.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify published frontend scripts and API integration
        run: |
          python3 - <<'PY'
          import time,urllib.request
          from urllib.parse import quote
          BASE = "https://pixben.netlify.app/"
          expected = {
              "css/accessibility.css?v=4": "CONTRASTE ALTO PREMIUM",
              "css/accessibility.css?v=6": "CONTRASTE ALTO UNIFICADO",
              "index.html": "accessibility.css?v=6",
              "htmls/contacto.html": "faq-cta-link",
              "htmls/favoritos.html": "cuenta-listados.css?v=7",
              "js/paginas/favoritos.js?v=7": "productos/por-ids",
              "css/cuenta-listados.css?v=7": "tarjeta-favorito-no-disponible",
              "htmls/perfil.html": "accessibility.css?v=6",
              "htmls/productos.html": "productos.js?v=12",
              "js/productos.js?v=12": "primeraPagina.content",
              "htmls/mis-pedidos.html": "mis-pedidos.js?v=8",
              "htmls/personaliza.html": "accessibility.css?v=6",
              "htmls/carrito de compras.html": "accessibility.css?v=6",
              "htmls/politica de privacidad.html": "accessibility.css?v=6",
              "htmls/preguntas frecuentes.html": "accessibility.css?v=6",
              "css/css personaliza.css?v=11": ".diseno-asistido-encabezado",
              "js/paginas/mis-pedidos.js?v=8": "Promise.allSettled",
              "htmls/carrito de compras.html": "css carrito de compras.css?v=9",
              "js/paginas/carrito.js?v=11": "Promise.allSettled",
              "js/paginas/index-destacados.js?v=2": "/productos/destacados",
              "css/css carrito de compras.css?v=9": ".checkout-legal-consent input[type=\"checkbox\"]",
              "js/admin.js?v=20": "/pedidos/admin/pagina",
          }
          for attempt in range(36):
              try:
                  for path, substring in expected.items():
                      request=urllib.request.Request(BASE+quote(path,safe="/?=&"),headers={"User-Agent":"PixBenNetlifyPostDeployCheck/1.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          body=response.read().decode("utf-8",errors="replace")
                          if response.status != 200 or substring not in body:
                              raise RuntimeError(f"Unexpected deployed content in {path}")
                          print(f"PASS {path} HTTP {response.status}",flush=True)
                  print("NETLIFY_DEPLOY_VERIFIED",flush=True)
                  break
              except Exception as exc:
                  print(f"Waiting for Netlify deployment {attempt+1}/36: {str(exc)[:180]}",flush=True)
                  time.sleep(10)
          else:
              raise SystemExit("Netlify did not publish expected PixBen assets")
          PY
