name: Rebuild PWA icon contrast

on:
  push:
    branches:
      - "fix-pwa-icon-contrast-20260930"
    paths:
      - ".github/workflows/rebuild-pwa-icon-contrast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix-pwa-icon-contrast-20260930"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild icons with light branded background
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          BG = (246, 240, 255, 255)  # lavanda muy claro
          src_dir = Path("public_html/imagensponsor")

          def rebuild(source, target, canvas, logo_fraction):
              im = Image.open(source).convert("RGBA")

              # El fondo negro conectado a las esquinas era el que ocultaba
              # cualquier parte negra del isotipo. Solo reemplazamos ese fondo.
              draw = ImageDraw.Draw(im)
              for seed in [(0,0),(im.width-1,0),(0,im.height-1),(im.width-1,im.height-1)]:
                  ImageDraw.floodfill(im, seed, BG, thresh=55)

              # Hallar el contenido que no es fondo y ampliarlo.
              px = im.load()
              xs, ys = [], []
              for y in range(im.height):
                  for x in range(im.width):
                      r,g,b,a = px[x,y]
                      if a < 20:
                          continue
                      if abs(r-BG[0]) + abs(g-BG[1]) + abs(b-BG[2]) > 45:
                          xs.append(x); ys.append(y)

              if xs and ys:
                  box = (min(xs), min(ys), max(xs)+1, max(ys)+1)
                  logo = im.crop(box)
              else:
                  logo = im

              out = Image.new("RGBA", (canvas, canvas), BG)
              max_side = int(canvas * logo_fraction)
              scale = min(max_side / logo.width, max_side / logo.height)
              size = (max(1, round(logo.width*scale)), max(1, round(logo.height*scale)))
              logo = logo.resize(size, Image.Resampling.LANCZOS)
              pos = ((canvas-size[0])//2, (canvas-size[1])//2)
              out.alpha_composite(logo, pos)
              out.convert("RGB").save(target, "PNG", optimize=True)

          rebuild(src_dir/"app-icon-512.png", src_dir/"app-icon-v4-512.png", 512, 0.82)
          rebuild(src_dir/"app-icon-512.png", src_dir/"app-icon-v4-192.png", 192, 0.82)
          rebuild(src_dir/"app-icon-maskable-512.png", src_dir/"app-icon-maskable-v4-512.png", 512, 0.70)
          rebuild(src_dir/"app-icon-maskable-512.png", src_dir/"app-icon-maskable-v4-192.png", 192, 0.70)
          PY

      - name: Commit rebuilt icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_html/imagensponsor/app-icon-v4-192.png                   public_html/imagensponsor/app-icon-v4-512.png                   public_html/imagensponsor/app-icon-maskable-v4-192.png                   public_html/imagensponsor/app-icon-maskable-v4-512.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
          else
            git commit -m "pwa: rebuild icons with visible black mark"
            git push origin HEAD:fix-pwa-icon-contrast-20260930
          fi
