name: Personalizador responsive layout test

on:
  pull_request:
    branches: ["master"]
    paths:
      - "public_html/htmls/personaliza.html"
      - "public_html/css/css personaliza.css"
      - "tests/personalizador-layout.cjs"
      - ".github/workflows/personalizador-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check assisted design card at desktop, tablet and mobile sizes
        run: node tests/personalizador-layout.cjs
