name: Frontend validation

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check public_html/js/config.js
          node --check public_html/js/admin.js
          node --check public_html/js/personaliza.js
          node --check public_html/js/pwa-premium.js
          node --check public_html/js/paginas/mis-pedidos.js
          node --check public_html/js/paginas/carrito.js
          node --check public_html/service-worker.js
