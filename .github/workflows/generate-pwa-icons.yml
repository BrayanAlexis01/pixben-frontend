name: Generate PWA raster icons

on:
  push:
    branches:
      - "fix-pwa-raster-icon-20260928"
    paths:
      - ".github/workflows/generate-pwa-icons.yml"
      - "public_html/imagensponsor/app-icon-v2.svg"
      - "public_html/imagensponsor/app-icon-maskable-v2.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix-pwa-raster-icon-20260928"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Generate versioned PNG icons
        run: |
          python - <<'PY'
          from cairosvg import svg2png
          jobs = [
              ("public_html/imagensponsor/app-icon-v2.svg", "public_html/imagensponsor/app-icon-v3-192.png", 192),
              ("public_html/imagensponsor/app-icon-v2.svg", "public_html/imagensponsor/app-icon-v3-512.png", 512),
              ("public_html/imagensponsor/app-icon-maskable-v2.svg", "public_html/imagensponsor/app-icon-maskable-v3-192.png", 192),
              ("public_html/imagensponsor/app-icon-maskable-v2.svg", "public_html/imagensponsor/app-icon-maskable-v3-512.png", 512),
          ]
          for source, target, size in jobs:
              svg2png(url=source, write_to=target, output_width=size, output_height=size)
              print(f"Generated {target}")
          PY
      - name: Commit generated PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_html/imagensponsor/app-icon-v3-192.png                   public_html/imagensponsor/app-icon-v3-512.png                   public_html/imagensponsor/app-icon-maskable-v3-192.png                   public_html/imagensponsor/app-icon-maskable-v3-512.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
          else
            git commit -m "pwa: generate raster icons v3"
            git push origin HEAD:fix-pwa-raster-icon-20260928
          fi
